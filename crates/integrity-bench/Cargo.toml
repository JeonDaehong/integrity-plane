[package]
name = "integrity-bench"
description = "Benchmarks for the Open Integrity Plane"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "integrity-bench"
path = "src/main.rs"

# All already in the dependency tree through integrity-server and its tests.
[dependencies]
integrity-index.workspace = true
integrity-txn.workspace = true
integrity-server = { path = "../integrity-server" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
axum = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
serde_json.workspace = true
apache-avro.workspace = true
arrow-array.workspace = true
arrow-schema.workspace = true
parquet.workspace = true

[lints]
workspace = true
