[package]
name = "integrity-txn"
description = "Transaction state machine, durable transaction log and recovery"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Test-only: makes `fault::hit` abort the process at the point named by OIP_FAULT.
fault-injection = []

[dependencies]
integrity-types.workspace = true
integrity-core.workspace = true
integrity-index.workspace = true
redb.workspace = true
blake3.workspace = true
serde.workspace = true
serde_json.workspace = true
# Terminal records are compressed (RFC 0010). MIT; the version parquet already uses.
zstd = { version = "0.14", default-features = false }

[dev-dependencies]
redb.workspace = true
proptest.workspace = true

[lints]
workspace = true
