# Example configuration for integrity-server (spec §26).
#
# Constraints are normally registered through the integrity API (POST /v1/integrity/constraints).
# Those declared below are imported only when the registry is first created; columns are Iceberg
# field ids.

[server]
bind = "0.0.0.0:8181"
# Require "Authorization: Bearer <token>" on /v1/integrity/* (except status, keys, /metrics).
# Audit events name the holder of the token used (ADR 0026); admin_token is the token named "admin".
# admin_token = "change-me"
# [[server.api_tokens]]
# name = "alice"
# token_sha256 = "<hex SHA-256 of alice's token, e.g. printf %s TOKEN | sha256sum>"

[upstream]
catalog_uri = "http://iceberg-rest:8181"
timeout_secs = 60
# Catalog prefix used by the integrity API to reach tables (/v1/{prefix}/namespaces/...), if any.
# prefix = "warehouse"

# Credentials for the Plane's own requests to the catalog (validation reads, onboarding, rebuild,
# verify, recovery). Writers' commits are forwarded with the writers' own credentials.
# [upstream.auth]
# type = "oauth2"                 # or: type = "bearer", token = "..."
# client_id = "integrity-plane"
# client_secret = "..."
# scope = "PRINCIPAL_ROLE:ALL"
# token_uri = "/v1/oauth/tokens"   # default; relative to catalog_uri, or an absolute URL

[control_store]
path = "/var/lib/integrity"

[limits]
max_inline_validation_bytes = "2GiB"
# Keys kept in memory per onboarding table or per commit validation; the rest spills to the control
# store.
scan_memory = "512MiB"
# Commits that may wait for one integrity domain at once; more get 429 + Retry-After (RFC 0007).
max_queued_commits = 32
# Commits to constrained tables per client per second (bursts of as many). Off by default.
# commits_per_client = 20
# Name clients by this header instead of the peer address; only behind a proxy that sets it.
# client_header = "X-Forwarded-For"

[txn_log]
# Finished transactions (and their idempotency keys) are kept this long, then deleted (RFC 0006).
# At least 30m, the idempotency-key-lifetime advertised to clients.
retention = "24h"
# Writes per logged chunk of a commit's staged index changes; bounds the memory of logging and
# applying a large commit. Rarely worth changing.
# chunk_writes = 100000

# Sign certificates (RFC 0005). The key file is created on first start if missing; publish its public
# key (GET /v1/integrity/keys) to verifiers, who pin it with `integrity verify --trusted-key`.
# [signing]
# key_file = "/var/lib/integrity/signing.key"
# require = false                 # true: verify treats unsigned snapshots as a broken chain
#
# Or keep the key outside the Plane (RFC 0009); commits are refused (INT-018, 409) while it cannot
# sign. A HashiCorp Vault Transit key of type ed25519:
# [signing]
# backend = "vault-transit"
# [signing.vault]
# address = "https://vault.example:8200"
# mount = "transit"
# key = "integrity-plane"
# key_version = 1                 # default: the latest version at start
# token_file = "/run/secrets/vault-token"   # default: the VAULT_TOKEN environment variable
#
# An Ed25519 key pair in a PKCS#11 token (an HSM):
# [signing]
# backend = "pkcs11"
# [signing.pkcs11]
# module = "/usr/lib/softhsm/libsofthsm2.so"
# token_label = "integrity"
# key_label = "cert-signing"      # CKA_LABEL of the private and the public key
# pin_file = "/run/secrets/hsm-pin"         # default: the INTEGRITY_PKCS11_PIN environment variable

[ha]
# "multi-table": forward commits as multi-table transactions asserting every table of the domain,
# so several Planes can take commits for the same tables (RFC 0012). Needs an upstream catalog
# with multi-table commits. Default "none": one Plane per domain.
fence = "none"

[catch_up]
# Follow certified snapshots the indexes have not seen (a restored control store, another Plane),
# validating them again, instead of refusing them until a rebuild (RFC 0011).
enabled = true
max_snapshots = 1000

[errors]
# Keep key values out of violation reports and the audit log (keys can be personal data).
redact_keys = false

# Any key can be overridden from the environment: INTEGRITY__SECTION__KEY, e.g.
# INTEGRITY__UPSTREAM__CATALOG_URI=http://polaris:8181 or INTEGRITY__SERVER__ADMIN_TOKEN=...

[storage]
endpoint = "http://minio:9000"
region = "us-east-1"
allow_http = true
# access_key_id / secret_access_key may also come from AWS_* environment variables.

[[constraint]]
id = 1
table = "db.customer"
name = "pk_customer"
type = "primary_key"
columns = [1]

[[constraint]]
id = 2
table = "db.orders"
name = "pk_orders"
type = "primary_key"
columns = [1]

[[constraint]]
id = 3
table = "db.orders"
name = "fk_orders_customer"
type = "foreign_key"
columns = [2]
references = { table = "db.customer", constraint = 1 }
match = "simple"
