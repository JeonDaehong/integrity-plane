# integrity-server configuration for deploy/docker-compose.yml. Constraints are registered through
# the integrity API or the `integrity` CLI.

[server]
bind = "0.0.0.0:8181"

[upstream]
catalog_uri = "http://iceberg-rest:8181"

[control_store]
path = "/var/lib/integrity"

[storage]
endpoint = "http://minio:9000"
region = "us-east-1"
access_key_id = "admin"
secret_access_key = "password"
allow_http = true
