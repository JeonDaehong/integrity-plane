# Local demo stack (spec §27 DoD 1): MinIO, the Iceberg reference REST catalog, and the Plane.
#
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# Writers use http://127.0.0.1:8181 as their REST catalog and http://127.0.0.1:9000 as the S3
# endpoint (path-style, credentials admin/password, region us-east-1). The upstream catalog is
# published on 8182 only so the demo can play a writer that bypasses the Plane; in a real
# deployment writers must not be able to reach it (docs/threat-model.md).
#
# MinIO no longer publishes new community images; the last published ones are pinned here.

services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
    ports: ["9000:9000"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      retries: 30

  bucket:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 admin password &&
             mc mb --ignore-existing local/warehouse"

  iceberg-rest:
    image: apache/iceberg-rest-fixture:1.10.1
    depends_on:
      bucket:
        condition: service_completed_successfully
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_REGION: us-east-1
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
    ports: ["8182:8181"]

  plane:
    build:
      context: ..
    container_name: integrity-plane
    depends_on: [iceberg-rest]
    volumes:
      - ./integrity.compose.toml:/etc/integrity/integrity.toml:ro
      - plane-control:/var/lib/integrity
    ports: ["8181:8181"]

volumes:
  plane-control:
