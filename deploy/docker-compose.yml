# Local demo stack (spec §27 DoD 1): S3-compatible object storage, the Iceberg reference REST
# catalog, and the Plane.
#
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# Writers use http://127.0.0.1:8181 as their REST catalog and http://127.0.0.1:9000 as the S3
# endpoint (path-style, region us-east-1, credentials admin/password). The upstream catalog is published on
# 8182 only so the demo can play a writer that bypasses the Plane; in a real deployment writers
# must not be able to reach it (docs/threat-model.md).
#
# Object storage is SeaweedFS's S3 gateway: MinIO's container images are no longer published (the
# Docker Hub repository is gone). The credentials are demo values: this stack is for local use only.

services:
  s3:
    image: chrislusf/seaweedfs:4.47
    command: server -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -dir=/data
    volumes:
      - ./seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
    ports: ["9000:8333"]

  bucket:
    image: amazon/aws-cli:2.37.9
    depends_on: [s3]
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_REGION: us-east-1
    entrypoint: ["sh", "-c"]
    command:
      - >
        for i in $$(seq 1 90); do
          aws --endpoint-url http://s3:8333 s3api head-bucket --bucket warehouse && exit 0;
          aws --endpoint-url http://s3:8333 s3 mb s3://warehouse && exit 0;
          sleep 2;
        done; exit 1

  iceberg-rest:
    image: apache/iceberg-rest-fixture:1.10.1
    depends_on:
      bucket:
        condition: service_completed_successfully
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_REGION: us-east-1
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://s3:8333
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
    ports: ["8182:8181"]

  plane:
    build:
      context: ..
    container_name: integrity-plane
    depends_on: [iceberg-rest]
    volumes:
      - ./integrity.compose.toml:/etc/integrity/integrity.toml:ro
      - plane-control:/var/lib/integrity
    ports: ["8181:8181"]

volumes:
  plane-control:
