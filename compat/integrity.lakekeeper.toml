# Gateway configuration for the compatibility tests against Lakekeeper (compat/lakekeeper_setup.sh).
# Lakekeeper serves the catalog under the warehouse id, set at start through the environment:
# INTEGRITY__UPSTREAM__PREFIX=<id>. Tables live in S3 (SeaweedFS). Constraints as in integrity.toml.

[server]
bind = "127.0.0.1:8181"

[upstream]
catalog_uri = "http://127.0.0.1:8185/catalog"

[control_store]
path = "target/compat-lakekeeper-control"

[storage]
endpoint = "http://127.0.0.1:9000"
region = "us-east-1"
access_key_id = "admin"
secret_access_key = "password"
allow_http = true

[[constraint]]
id = 21
table = "spark.customer"
name = "pk_customer"
type = "primary_key"
columns = [1]

[[constraint]]
id = 22
table = "spark.customer"
name = "nn_customer_name"
type = "not_null"
columns = [2]

[[constraint]]
id = 23
table = "spark.orders"
name = "pk_orders"
type = "primary_key"
columns = [1]

[[constraint]]
id = 24
table = "spark.orders"
name = "fk_orders_customer"
type = "foreign_key"
columns = [2]
references = { table = "spark.customer", constraint = 21 }

[[constraint]]
id = 25
table = "spark.region"
name = "pk_region"
type = "primary_key"
columns = [1, 2]

[[constraint]]
id = 26
table = "spark.store"
name = "pk_store"
type = "primary_key"
columns = [1]

[[constraint]]
id = 27
table = "spark.store"
name = "fk_store_region"
type = "foreign_key"
columns = [2, 3]
references = { table = "spark.region", constraint = 25 }

# Merge-on-read (Spark): mcust(customer_id long, name string), morders(order_id long,
# customer_id long), both with position deletes for DELETE / UPDATE / MERGE.
[[constraint]]
id = 28
table = "spark.mcust"
name = "pk_mcust"
type = "primary_key"
columns = [1]

[[constraint]]
id = 29
table = "spark.morders"
name = "pk_morders"
type = "primary_key"
columns = [1]

[[constraint]]
id = 30
table = "spark.morders"
name = "fk_morders_mcust"
type = "foreign_key"
columns = [2]
references = { table = "spark.mcust", constraint = 28 }
