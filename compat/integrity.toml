# Gateway configuration for the compatibility tests. Field ids follow column order of the
# CREATE TABLE statements in the client scripts (ids are assigned 1, 2, ... by the catalog).

[server]
bind = "127.0.0.1:8181"

[upstream]
catalog_uri = "http://127.0.0.1:8182"

[control_store]
path = "target/compat-control"

# Files are local (/tmp/warehouse); no [storage] section needed.

# customer(customer_id long, name string); orders(order_id long, customer_id long)
# Each client uses its own namespace so runs do not interfere.

[[constraint]]
id = 11
table = "pyiceberg.customer"
name = "pk_customer"
type = "primary_key"
columns = [1]

[[constraint]]
id = 12
table = "pyiceberg.customer"
name = "nn_customer_name"
type = "not_null"
columns = [2]

[[constraint]]
id = 13
table = "pyiceberg.orders"
name = "pk_orders"
type = "primary_key"
columns = [1]

[[constraint]]
id = 14
table = "pyiceberg.orders"
name = "fk_orders_customer"
type = "foreign_key"
columns = [2]
references = { table = "pyiceberg.customer", constraint = 11 }

[[constraint]]
id = 21
table = "spark.customer"
name = "pk_customer"
type = "primary_key"
columns = [1]

[[constraint]]
id = 22
table = "spark.customer"
name = "nn_customer_name"
type = "not_null"
columns = [2]

[[constraint]]
id = 23
table = "spark.orders"
name = "pk_orders"
type = "primary_key"
columns = [1]

[[constraint]]
id = 24
table = "spark.orders"
name = "fk_orders_customer"
type = "foreign_key"
columns = [2]
references = { table = "spark.customer", constraint = 21 }

[[constraint]]
id = 31
table = "irust.customer"
name = "pk_customer"
type = "primary_key"
columns = [1]

[[constraint]]
id = 32
table = "irust.customer"
name = "nn_customer_name"
type = "not_null"
columns = [2]

[[constraint]]
id = 33
table = "irust.orders"
name = "pk_orders"
type = "primary_key"
columns = [1]

[[constraint]]
id = 34
table = "irust.orders"
name = "fk_orders_customer"
type = "foreign_key"
columns = [2]
references = { table = "irust.customer", constraint = 31 }

# Composite keys (Spark): region(country string, code string, name string),
# store(id long, country string, code string), store(country, code) -> region.
[[constraint]]
id = 25
table = "spark.region"
name = "pk_region"
type = "primary_key"
columns = [1, 2]

[[constraint]]
id = 26
table = "spark.store"
name = "pk_store"
type = "primary_key"
columns = [1]

[[constraint]]
id = 27
table = "spark.store"
name = "fk_store_region"
type = "foreign_key"
columns = [2, 3]
references = { table = "spark.region", constraint = 25 }

# Merge-on-read (Spark): mcust(customer_id long, name string), morders(order_id long,
# customer_id long), both with position deletes for DELETE / UPDATE / MERGE.
[[constraint]]
id = 28
table = "spark.mcust"
name = "pk_mcust"
type = "primary_key"
columns = [1]

[[constraint]]
id = 29
table = "spark.morders"
name = "pk_morders"
type = "primary_key"
columns = [1]

[[constraint]]
id = 30
table = "spark.morders"
name = "fk_morders_mcust"
type = "foreign_key"
columns = [2]
references = { table = "spark.mcust", constraint = 28 }
