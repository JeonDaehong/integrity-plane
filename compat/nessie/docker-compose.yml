# Project Nessie as the upstream catalog for the compatibility tests: its Iceberg REST endpoint
# (/iceberg), an in-memory version store, and SeaweedFS's S3 gateway for table data.
services:
  s3:
    image: chrislusf/seaweedfs:4.47
    command: server -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -dir=/data
    volumes:
      - ../../deploy/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
    # Nessie hands its storage endpoint (http://s3:8333) to clients: the CI host maps the name s3
    # to 127.0.0.1, so the same endpoint works inside and outside the compose network.
    ports: ["9000:8333", "8333:8333"]

  bucket:
    image: amazon/aws-cli:2.37.9
    depends_on: [s3]
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_REGION: us-east-1
    entrypoint: ["sh", "-c"]
    command:
      - >
        for i in $$(seq 1 90); do
          aws --endpoint-url http://s3:8333 s3api head-bucket --bucket warehouse && exit 0;
          aws --endpoint-url http://s3:8333 s3 mb s3://warehouse && exit 0;
          sleep 2;
        done; exit 1

  nessie:
    image: ghcr.io/projectnessie/nessie:0.108.8
    depends_on:
      bucket:
        condition: service_completed_successfully
    environment:
      - nessie.version.store.type=IN_MEMORY
      - nessie.server.authentication.enabled=false
      - nessie.catalog.default-warehouse=warehouse
      - nessie.catalog.warehouses.warehouse.location=s3://warehouse/nessie/
      - nessie.catalog.service.s3.default-options.endpoint=http://s3:8333/
      - nessie.catalog.service.s3.default-options.region=us-east-1
      - nessie.catalog.service.s3.default-options.path-style-access=true
      - nessie.catalog.service.s3.default-options.access-key=urn:nessie-secret:quarkus:nessie.catalog.secrets.access-key
      - nessie.catalog.secrets.access-key.name=admin
      - nessie.catalog.secrets.access-key.secret=password
    ports: ["19120:19120"]
