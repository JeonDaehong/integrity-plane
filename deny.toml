# cargo-deny configuration. See CONTRIBUTING.md rule 4: every new dependency must pass this.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.9
# The allow list is a policy, not an inventory; unused entries are expected.
unused-allowed-license = "allow"
# Permissive licenses compatible with Apache-2.0 distribution.
# Adding a license here requires a justification in the PR or an ADR.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

# Narrow exceptions, one crate each, with the reason.
[[licenses.exceptions]]
# Public-domain dedication. Reached only at compile time via a proc-macro
# (arrow-select -> ahash -> const-random -> const-random-macro); not linked into binaries.
crate = "tiny-keccak"
allow = ["CC0-1.0"]

[[licenses.exceptions]]
# Mozilla's root CA certificates as data (CDLA-Permissive-2.0, a permissive data licence),
# used by rustls-platform-verifier via reqwest to verify TLS connections (ADR 0011).
crate = "webpki-root-certs"
allow = ["CDLA-Permissive-2.0"]
