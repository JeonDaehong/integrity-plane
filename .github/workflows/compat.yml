name: Compatibility

# Phase 7: real Iceberg clients (PyIceberg, Spark, iceberg-rust) against the gateway, with the
# Iceberg reference REST catalog as upstream (compat/docker-compose.yml).
# Phase 10: the Appendix A demo (Spark + the integrity CLI), including a bypassing writer.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clients:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            compat/iceberg-rust -> target
      - name: Build gateway and the iceberg-rust client
        run: |
          cargo build --release --locked -p integrity-server -p integrity-cli
          cargo build --release --locked --manifest-path compat/iceberg-rust/Cargo.toml
      - name: Start upstream catalog
        run: |
          mkdir -p /tmp/warehouse && chmod 777 /tmp/warehouse
          docker compose -f compat/docker-compose.yml up -d
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8182/v1/config && break; sleep 2; done
      - name: Start gateway
        run: |
          ./target/release/integrity-server compat/integrity.toml > gateway.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8181/v1/integrity/status && break; sleep 1; done
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install clients
        run: pip install "pyiceberg[pyarrow]==0.12.0" "pyspark==3.5.6"
      # The catalog runs as root in its container and creates the table directories, so the
      # clients write data files as root too.
      - name: PyIceberg
        run: sudo -E env "PATH=$PATH" python compat/pyiceberg_test.py
      - name: Spark
        run: sudo -E env "PATH=$PATH" "JAVA_HOME=$JAVA_HOME" python compat/spark_test.py
      - name: iceberg-rust
        run: sudo ./compat/iceberg-rust/target/release/integrity-compat-iceberg-rust
      - name: Appendix A demo
        run: sudo -E env "PATH=$PATH" "JAVA_HOME=$JAVA_HOME" python compat/demo_test.py
      - name: Logs
        if: always()
        run: |
          echo "--- gateway"; cat gateway.log || true
          echo "--- gateway (restarted by the demo)"; cat gateway-restarted.log || true
          echo "--- upstream"; docker compose -f compat/docker-compose.yml logs --tail 200 || true
