name: Compatibility

# Phase 7: real Iceberg clients (PyIceberg, Spark, iceberg-rust) against the gateway, with the
# Iceberg reference REST catalog as upstream (compat/docker-compose.yml).
# Phase 10: the Appendix A demo (Spark + the integrity CLI), including a bypassing writer.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clients:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            compat/iceberg-rust -> target
      - name: Build gateway and the iceberg-rust client
        run: |
          cargo build --release --locked -p integrity-server -p integrity-cli
          cargo build --release --locked --manifest-path compat/iceberg-rust/Cargo.toml
      - name: Start upstream catalog
        run: |
          mkdir -p /tmp/warehouse && chmod 777 /tmp/warehouse
          docker compose -f compat/docker-compose.yml up -d
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8182/v1/config && break; sleep 2; done
      - name: Start gateway
        run: |
          ./target/release/integrity-server compat/integrity.toml > gateway.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8181/v1/integrity/status && break; sleep 1; done
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install clients
        run: pip install "pyiceberg[pyarrow]==0.12.0" "pyspark==3.5.6"
      # The catalog runs as root in its container and creates the table directories, so the
      # clients write data files as root too.
      - name: PyIceberg
        run: sudo -E env "PATH=$PATH" python compat/pyiceberg_test.py
      - name: Spark
        run: sudo -E env "PATH=$PATH" "JAVA_HOME=$JAVA_HOME" python compat/spark_test.py
      - name: verify the merge-on-read table
        run: |
          cargo build --release --locked -p integrity-cli
          ./target/release/integrity verify spark.mcust
          ./target/release/integrity verify spark.dvcust
      - name: iceberg-rust
        run: sudo ./compat/iceberg-rust/target/release/integrity-compat-iceberg-rust
      - name: Every client's snapshots carry valid signatures (RFC 0005)
        run: |
          ./target/release/integrity keys
          for t in pyiceberg.customer pyiceberg.orders spark.customer spark.region spark.mcust spark.dvcust irust.customer; do
            ./target/release/integrity verify "$t" --require-signatures
          done
      - name: Appendix A demo
        run: sudo -E env "PATH=$PATH" "JAVA_HOME=$JAVA_HOME" python compat/demo_test.py
      - name: Logs
        if: always()
        run: |
          echo "--- gateway"; cat gateway.log || true
          echo "--- gateway (restarted by the demo)"; cat gateway-restarted.log || true
          echo "--- upstream"; docker compose -f compat/docker-compose.yml logs --tail 200 || true

  # Spec §27 DoD 1: `docker compose up` (S3 storage + upstream catalog + Plane built from the
  # Dockerfile), then the Appendix A demo over S3.
  compose-s3:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the CLI
        run: cargo build --release --locked -p integrity-cli
      - name: docker compose up
        run: |
          docker compose -f deploy/docker-compose.yml up -d --build
          for i in $(seq 1 90); do curl -sf http://127.0.0.1:8182/v1/config && curl -sf http://127.0.0.1:8181/v1/integrity/status && break; sleep 2; done
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Spark
        run: pip install "pyspark==3.5.6"
      - name: Appendix A demo over S3
        env:
          DEMO_S3: "1"
          AWS_ACCESS_KEY_ID: admin
          AWS_SECRET_ACCESS_KEY: password
          AWS_REGION: us-east-1
          INTEGRITY_RESTART: docker kill -s KILL integrity-plane && docker compose -f deploy/docker-compose.yml up -d plane
        run: python compat/demo_test.py
      - name: Logs
        if: always()
        run: docker compose -f deploy/docker-compose.yml logs --tail 300 || true

  # Apache Polaris as the upstream catalog: OAuth2 for clients and for the Plane itself, and a
  # catalog prefix. PyIceberg and Spark run the same scenarios as against the reference catalog.
  polaris:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CATALOG_PROPS: '{"credential": "root:s3cr3t", "warehouse": "compat", "scope": "PRINCIPAL_ROLE:ALL"}'
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build gateway and CLI
        run: cargo build --release --locked -p integrity-server -p integrity-cli
      - name: Start Polaris
        run: bash compat/polaris_setup.sh
      - name: Start gateway
        run: |
          ./target/release/integrity-server compat/integrity.polaris.toml > gateway.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8181/v1/integrity/status && break; sleep 1; done
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install clients
        run: pip install "pyiceberg[pyarrow]==0.12.0" "pyspark==3.5.6"
      - name: PyIceberg
        run: sudo -E env "PATH=$PATH" python compat/pyiceberg_test.py
      - name: Spark
        run: sudo -E env "PATH=$PATH" "JAVA_HOME=$JAVA_HOME" python compat/spark_test.py
      - name: verify through the Plane's own credentials
        run: |
          ./target/release/integrity verify pyiceberg.customer
          ./target/release/integrity verify spark.region
          ./target/release/integrity verify spark.mcust
          ./target/release/integrity verify spark.dvcust
      - name: Logs
        if: always()
        run: |
          echo "--- gateway"; cat gateway.log || true
          echo "--- polaris"; docker logs --tail 300 polaris || true

  # Lakekeeper as the upstream catalog: Postgres-backed, warehouse id as the catalog prefix, table
  # data in S3. Spark writes through S3FileIO with its own credentials.
  lakekeeper:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CATALOG_PROPS: '{"warehouse": "compat", "io-impl": "org.apache.iceberg.aws.s3.S3FileIO", "s3.endpoint": "http://127.0.0.1:9000", "s3.path-style-access": "true", "client.region": "us-east-1"}'
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build gateway and CLI
        run: cargo build --release --locked -p integrity-server -p integrity-cli
      - name: Start Lakekeeper
        run: |
          echo "127.0.0.1 s3" | sudo tee -a /etc/hosts
          prefix=$(bash compat/lakekeeper_setup.sh | tail -1)
          test -n "$prefix"
          echo "INTEGRITY__UPSTREAM__PREFIX=$prefix" >> "$GITHUB_ENV"
      - name: Start gateway
        run: |
          echo "prefix: $INTEGRITY__UPSTREAM__PREFIX"
          ./target/release/integrity-server compat/integrity.lakekeeper.toml > gateway.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8181/v1/integrity/status && break; sleep 1; done
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Spark
        run: pip install "pyspark==3.5.6"
      - name: Spark
        run: python compat/spark_test.py
      - name: verify
        run: |
          ./target/release/integrity verify spark.customer
          ./target/release/integrity verify spark.region
          ./target/release/integrity verify spark.mcust
          ./target/release/integrity verify spark.dvcust
      - name: Logs
        if: always()
        run: |
          echo "--- gateway"; cat gateway.log || true
          echo "--- lakekeeper"; docker compose -f compat/lakekeeper/docker-compose.yml logs --tail 200 || true

  # Project Nessie as the upstream catalog: its Iceberg REST endpoint, a branch-and-warehouse
  # catalog prefix, table data in S3.
  nessie:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CATALOG_PROPS: '{"warehouse": "warehouse", "io-impl": "org.apache.iceberg.aws.s3.S3FileIO", "s3.endpoint": "http://127.0.0.1:9000", "s3.path-style-access": "true", "client.region": "us-east-1"}'
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_REGION: us-east-1
      # Nessie 0.108 creates format v2 tables even when v3 is requested.
      SKIP_V3: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build gateway and CLI
        run: cargo build --release --locked -p integrity-server -p integrity-cli
      - name: Start Nessie
        run: |
          echo "127.0.0.1 s3" | sudo tee -a /etc/hosts
          prefix=$(bash compat/nessie_setup.sh | tail -1)
          test -n "$prefix"
          echo "INTEGRITY__UPSTREAM__PREFIX=$prefix" >> "$GITHUB_ENV"
      - name: Start gateway
        run: |
          echo "prefix: $INTEGRITY__UPSTREAM__PREFIX"
          ./target/release/integrity-server compat/integrity.nessie.toml > gateway.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8181/v1/integrity/status && break; sleep 1; done
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Spark
        run: pip install "pyspark==3.5.6"
      - name: Spark
        run: python compat/spark_test.py
      # Nessie serves only the current snapshot of a table: verify cannot recompute certificates
      # (UNVERIFIABLE) but must never report a break.
      - name: verify
        run: |
          for t in spark.customer spark.region spark.mcust; do
            ./target/release/integrity verify "$t" | tee verify.txt || true
            if grep -q BROKEN verify.txt; then exit 1; fi
          done
      - name: Logs
        if: always()
        run: |
          echo "--- gateway"; cat gateway.log || true
          echo "--- nessie"; docker compose -f compat/nessie/docker-compose.yml logs --tail 200 || true
