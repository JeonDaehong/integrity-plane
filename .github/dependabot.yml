# Weekly dependency updates. Security advisories (cargo deny in CI) are raised as soon as they
# appear; these keep the lockfiles, pinned actions and base images from drifting meanwhile.
version: 2
updates:
  - package-ecosystem: cargo
    directories: ["/", "/fuzz"]
    schedule:
      interval: weekly
    groups:
      cargo-patch-and-minor:
        update-types: [patch, minor]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    # Its refs name Rust toolchains (`@stable`, `@1.90` for the MSRV job), not action versions.
    ignore:
      - dependency-name: dtolnay/rust-toolchain

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
