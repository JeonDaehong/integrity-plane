[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
repository = "https://github.com/JeonDaehong/integrity-plane"
publish = false

[workspace.dependencies]
integrity-types = { path = "crates/integrity-types" }
integrity-core = { path = "crates/integrity-core" }
integrity-index = { path = "crates/integrity-index" }
integrity-validator = { path = "crates/integrity-validator" }
integrity-txn = { path = "crates/integrity-txn" }
integrity-iceberg = { path = "crates/integrity-iceberg" }
integrity-reference = { path = "crates/integrity-reference" }

# Third-party. Each addition is justified in its PR or an ADR (CONTRIBUTING.md rule 4).
proptest = "1.11"
blake3 = { version = "1.8", default-features = false, features = ["std", "pure"] }
redb = "4.3"
# Parquet/Arrow (Apache arrow-rs). Codecs = those Iceberg writers use; zstd is the Iceberg default.
parquet = { version = "60", default-features = false, features = ["arrow", "zstd", "snap", "lz4", "flate2-rust_backend"] }
arrow-array = "60"
arrow-schema = "60"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
apache-avro = { version = "0.22", default-features = false, features = ["snappy", "zstandard"] }
# Iceberg v3 deletion vectors are 64-bit Roaring bitmaps (ADR 0018). MIT OR Apache-2.0, pure Rust.
roaring = "0.11.5"
# Certificate signatures (RFC 0005). BSD-3-Clause, pure Rust.
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["fast", "zeroize"] }
# OS randomness for generating signing keys.
getrandom = "0.3.4"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

# The persistent index converts panics inside the storage engine into fail-closed errors
# (ADR 0005). That requires unwinding; never switch these to "abort".
[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
